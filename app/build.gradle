plugins { id 'com.android.application' }
android {
    namespace 'com.dekorher.neonkilit'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dekorher.neonkilit'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    signingConfigs {
        sabit { storeFile file('../imza.jks'); storePassword 'dekorher'; keyAlias 'neonkilit'; keyPassword 'dekorher' }
    }
    buildTypes { debug { signingConfig signingConfigs.sabit } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
