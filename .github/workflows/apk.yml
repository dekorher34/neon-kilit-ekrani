name: APK oluştur
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Sayfayı uygulamaya kopyala
        run: cp neon_kilit_ekrani.html app/src/main/assets/index.html
      - name: APK derle
        run: gradle :app:assembleDebug --no-daemon
      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk NeonKilitEkrani.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Neon Kilit Ekranı 1.0.${{ github.run_number }}
          body: Dekorher — Neon Kilit Ekranı. Aşağıdaki Assets kısmından NeonKilitEkrani.apk dosyasını indir.
          files: NeonKilitEkrani.apk
          make_latest: true
